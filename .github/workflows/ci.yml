name: CI

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  backend:
    name: Backend (go vet, go build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: palabatu-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: palabatu-be/go.mod
      - run: go vet ./...
      - run: go build ./...

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: palabatu-fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: palabatu-fe/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
