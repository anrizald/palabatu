# Render Blueprint for a free testing deploy of palabatu-be, which also
# serves the built palabatu-fe (see Dockerfile) - one service, one URL.
# Import at https://dashboard.render.com/blueprints, or `render blueprint launch`.
#
# Secrets (sync: false) are not set here - fill them in via the Render
# dashboard after the service is created. See README/CLAUDE.md for what
# each one is; values live in palabatu-be/environments/.env.example.
services:
  - type: web
    name: palabatu-testing
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OWNER_USER_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
